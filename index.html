<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dickens 的生活雜記</title>
<meta name="description" content="Dickens 的生活雜記 - 記錄生活中的點點滴滴">
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>

<header class="site-header">
  <div class="container">
    <nav class="nav">
      <a href="index.html" class="site-title">Dickens</a>
      <ul class="nav-links">
        <li><a href="index.html">首頁</a></li>
        <li><a href="posts.html">文章</a></li>
        <li><a href="about.html">關於</a></li>
        <li><button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="切換主題">🌙</button></li>
      </ul>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="container">
    <span class="hero-badge">📝 生活雜記</span>
    <h1>Dickens 的生活雜記</h1>
    <p>免得以後有老人痴呆..忘了要去哪找到以前的資料 哈哈哈!!</p>
  </div>
</section>

<main>
  <div class="container">
    <div class="section-title">最新文章</div>
    <div class="post-grid" id="recentPosts"></div>
    <div class="empty-state" id="emptyState" style="display:none;">
      <div class="icon">📭</div>
      <p>還沒有文章，敬請期待...</p>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-links">
      <a href="https://github.com/pkjoe88" target="_blank">GitHub</a>
      <a href="posts.html">文章</a>
      <a href="about.html">關於</a>
    </div>
    <p>&copy; 2026 Dickens &middot; 用 GitHub Pages 建立</p>
  </div>
</footer>

<button class="back-to-top" id="backToTop" aria-label="回到頂部">↑</button>

<script src="js/main.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  fetch('data/posts.json')
    .then(r => r.json())
    .then(posts => {
      const container = document.getElementById('recentPosts');
      const empty = document.getElementById('emptyState');
      if (!posts || posts.length === 0) {
        empty.style.display = 'block';
        return;
      }
      posts.sort((a, b) => new Date(b.date) - new Date(a.date));
      posts.slice(0, 6).forEach(post => {
        const card = document.createElement('div');
        card.className = 'post-card';
        const readTime = Math.max(1, Math.ceil(post.excerpt.length / 100));
        card.innerHTML = `
          <div class="post-card-meta">
            <span>${post.date}</span>
            <div class="post-card-tags">
              ${post.tags.map(t => `<span class="post-tag">${t}</span>`).join('')}
            </div>
          </div>
          <h2 class="post-card-title"><a href="${post.file}">${post.title}</a></h2>
          <p class="post-card-excerpt">${post.excerpt}</p>
          <div class="post-card-footer">
            <span class="read-time">📖 約 ${readTime} 分鐘閱讀</span>
            <a href="${post.file}" class="read-more">繼續閱讀 →</a>
          </div>
        `;
        container.appendChild(card);
      });
    })
    .catch(err => {
      console.error('Failed to load posts:', err);
      document.getElementById('emptyState').style.display = 'block';
    });
});
</script>
</body>
</html>
