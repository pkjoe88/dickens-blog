<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dickens 的生活雜記</title>
<meta name="description" content="Dickens 的生活雜記 - 記錄生活中的點點滴滴">
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>

<!-- Top Bar -->
<div class="top-bar">
  <div class="container">
    <div class="top-bar-left">
      <span>📅 <span id="currentDate"></span></span>
    </div>
    <div class="top-bar-right">
      <a href="https://github.com/pkjoe88" target="_blank" class="social-icon" title="GitHub">GH</a>
    </div>
  </div>
</div>

<!-- Header -->
<header class="site-header">
  <div class="container">
    <div class="header-main">
      <nav class="nav">
        <a href="index.html" class="site-logo">
          <div class="logo-icon">D</div>
          <span class="site-title">Dickens</span>
        </a>
        <ul class="nav-links">
          <li><a href="index.html" class="active">首頁</a></li>
          <li class="nav-dropdown">
            <a href="posts.html">文章 ▾</a>
            <div class="nav-dropdown-menu">
              <a href="posts.html">所有文章</a>
              <a href="posts.html?tag=技術">技術</a>
              <a href="posts.html?tag=生活">生活</a>
              <a href="posts.html?tag=網路">網路</a>
            </div>
          </li>
          <li><a href="about.html">關於</a></li>
          <li><a href="cloud-computers.html">雲電腦</a></li>
        </ul>
        <div class="nav-actions">
          <button class="search-btn" onclick="window.location='posts.html'" title="搜尋">🔍</button>
          <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="切換主題">🌙</button>
        </div>
      </nav>
    </div>
  </div>
</header>

<!-- Hero Section -->
<section class="hero-section">
  <div class="container">
    <div class="hero-grid" id="heroGrid">
      <!-- Filled by JS -->
    </div>
  </div>
</section>

<!-- Main Content -->
<main>
  <div class="container">
    <div class="main-layout">
      <!-- Left: Content -->
      <div>
        <!-- Topics -->
        <div class="section-header">
          <h2>主題分類</h2>
        </div>
        <div class="topics-grid" id="topicsGrid"></div>

        <!-- Latest Posts -->
        <div class="section-header">
          <h2>最新文章</h2>
          <a href="posts.html">查看全部 →</a>
        </div>
        <div class="post-grid" id="recentPosts"></div>
      </div>

      <!-- Sidebar -->
      <aside class="sidebar">
        <!-- About Widget -->
        <div class="sidebar-widget about-widget">
          <div class="avatar">D</div>
          <h4>Dickens</h4>
          <p>生活雜記的作者，技術愛好者，踩坑專業戶</p>
          <div class="social-links">
            <a href="https://github.com/pkjoe88" target="_blank" class="social-link" title="GitHub">GH</a>
          </div>
        </div>

        <!-- Popular Posts -->
        <div class="sidebar-widget">
          <h3>熱門文章</h3>
          <div id="popularPosts"></div>
        </div>

        <!-- Tag Cloud -->
        <div class="sidebar-widget">
          <h3>標籤雲</h3>
          <div class="tag-cloud" id="tagCloud"></div>
        </div>

        <!-- Newsletter -->
        <div class="sidebar-widget">
          <h3>訂閱更新</h3>
          <p style="font-size:13px; color:var(--text-secondary); margin-bottom:12px;">新文章第一時間通知你</p>
          <form class="newsletter-form" onsubmit="return false;">
            <input type="email" placeholder="你的 Email">
            <button type="submit">訂閱</button>
          </form>
        </div>
      </aside>
    </div>
  </div>
</main>

<!-- Footer -->
<footer class="site-footer">
  <div class="container">
    <div class="footer-grid">
      <div class="footer-col">
        <h4>Dickens 的生活雜記</h4>
        <p>記錄生活中的點點滴滴，免得以後有老人痴呆..忘了要去哪找到以前的資料 哈哈哈!!</p>
      </div>
      <div class="footer-col">
        <h4>快速連結</h4>
        <ul>
          <li><a href="index.html">首頁</a></li>
          <li><a href="posts.html">所有文章</a></li>
          <li><a href="about.html">關於</a></li>
          <li><a href="cloud-computers.html">雲電腦</a></li>
        </ul>
      </div>
      <div class="footer-col">
        <h4>主題分類</h4>
        <ul id="footerTags"></ul>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2026 Dickens &middot; 用 GitHub Pages 建立</p>
    </div>
  </div>
</footer>

<button class="back-to-top" id="backToTop" aria-label="回到頂部">↑</button>

<script src="js/main.js"></script>
<script>
// Date
document.getElementById('currentDate').textContent = new Date().toLocaleDateString('zh-TW', {year:'numeric', month:'long', day:'numeric'});

document.addEventListener('DOMContentLoaded', function() {
  fetch('data/posts.json')
    .then(r => r.json())
    .then(posts => {
      posts.sort((a, b) => new Date(b.date) - new Date(a.date));

      // Hero grid
      const heroGrid = document.getElementById('heroGrid');
      if (posts.length > 0) {
        const main = posts[0];
        heroGrid.innerHTML = `
          <a href="${main.file}" class="hero-main" style="text-decoration:none; color:#fff;">
            <span class="category-badge">${main.tags[0]}</span>
            <h1>${main.title}</h1>
            <p>${main.excerpt}</p>
            <div class="hero-meta">
              <img src="https://api.dicebear.com/7.x/initials/svg?seed=Dickens&backgroundColor=7c5cff" alt="Dickens">
              <span>Dickens</span>
              <span>·</span>
              <span>${main.date}</span>
            </div>
          </a>
          <div class="hero-side">
            ${posts.slice(1, 3).map(p => `
              <a href="${p.file}" class="hero-side-card">
                <div class="cat">${p.tags[0]}</div>
                <h3>${p.title}</h3>
              </a>
            `).join('')}
          </div>
        `;
      }

      // Topics
      const tags = {};
      posts.forEach(p => p.tags.forEach(t => { tags[t] = (tags[t] || 0) + 1; }));
      const topicIcons = {'技術':'💻', '生活':'📝', '網路':'🌐', 'GitHub':'🐙', '公告':'📢', '工具':'🔧', 'Windows':'🪟', 'VPN':'🔐', 'Python':'🐍', 'Linux':'🐧', '伺服器':'🖥'};
      const topicsGrid = document.getElementById('topicsGrid');
      Object.entries(tags).forEach(([tag, count]) => {
        topicsGrid.innerHTML += `
          <a href="posts.html?tag=${encodeURIComponent(tag)}" class="topic-card">
            <div class="icon">${topicIcons[tag] || '📄'}</div>
            <h4>${tag}</h4>
            <div class="count">${count} 篇文章</div>
          </a>
        `;
      });

      // Recent posts
      const recentContainer = document.getElementById('recentPosts');
      posts.slice(0, 4).forEach(post => {
        const card = document.createElement('div');
        card.className = 'post-card';
        const readTime = Math.max(1, Math.ceil(post.excerpt.length / 100));
        card.innerHTML = `
          <div class="post-card-image">
            <div class="placeholder">${topicIcons[post.tags[0]] || '📄'}</div>
            <span class="category-badge">${post.tags[0]}</span>
          </div>
          <div class="post-card-body">
            <div class="post-card-meta">
              <div class="author">
                <div class="author-avatar">D</div>
                <span>Dickens</span>
              </div>
              <span>${post.date}</span>
            </div>
            <h2 class="post-card-title"><a href="${post.file}">${post.title}</a></h2>
            <p class="post-card-excerpt">${post.excerpt}</p>
            <div class="post-card-footer">
              <span>📖 ${readTime} 分鐘閱讀</span>
              <a href="${post.file}" class="read-more">繼續閱讀 →</a>
            </div>
          </div>
        `;
        recentContainer.appendChild(card);
      });

      // Popular posts (sidebar)
      const popularContainer = document.getElementById('popularPosts');
      posts.slice(0, 4).forEach(post => {
        popularContainer.innerHTML += `
          <div class="popular-post">
            <div class="thumb">${topicIcons[post.tags[0]] || '📄'}</div>
            <div class="info">
              <h4><a href="${post.file}">${post.title}</a></h4>
              <div class="date">${post.date}</div>
            </div>
          </div>
        `;
      });

      // Tag cloud
      const tagCloud = document.getElementById('tagCloud');
      Object.keys(tags).forEach(tag => {
        tagCloud.innerHTML += `<a href="posts.html?tag=${encodeURIComponent(tag)}">${tag}</a>`;
      });

      // Footer tags
      const footerTags = document.getElementById('footerTags');
      Object.keys(tags).forEach(tag => {
        footerTags.innerHTML += `<li><a href="posts.html?tag=${encodeURIComponent(tag)}">${tag}</a></li>`;
      });
    })
    .catch(err => {
      console.error('Failed to load posts:', err);
    });
});
</script>
</body>
</html>
