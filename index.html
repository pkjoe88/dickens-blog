<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dickens 的生活雜記</title>
<meta name="description" content="Dickens 的生活雜記 - 記錄生活中的點點滴滴">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <nav class="nav">
      <a href="index.html" class="site-title">Dickens</a>
      <ul class="nav-links">
        <li><a href="index.html">首頁</a></li>
        <li><a href="posts.html">文章</a></li>
        <li><a href="about.html">關於</a></li>
        <li><button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="切換主題">🌙</button></li>
      </ul>
    </nav>
  </div>
</header>

<main>
  <div class="container">
    <section class="hero">
      <h1>Dickens 的生活雜記</h1>
      <p>免得以後有老人痴呆..忘了要去哪找到以前的資料 哈哈哈!!</p>
    </section>

    <h2 style="font-size:20px; margin-bottom:16px; color:var(--text-secondary);">最新文章</h2>
    <ul class="post-list" id="recentPosts"></ul>
    <div class="empty-state" id="emptyState" style="display:none;">
      <p>還沒有文章，敬請期待...</p>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <p>&copy; 2026 Dickens &middot; 用 <a href="https://pages.github.com/" target="_blank">GitHub Pages</a> 建立</p>
  </div>
</footer>

<button class="back-to-top" id="backToTop" aria-label="回到頂部">↑</button>

<script src="js/main.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  fetch('data/posts.json')
    .then(r => r.json())
    .then(posts => {
      const list = document.getElementById('recentPosts');
      const empty = document.getElementById('emptyState');
      if (!posts || posts.length === 0) {
        empty.style.display = 'block';
        return;
      }
      // Sort by date descending
      posts.sort((a, b) => new Date(b.date) - new Date(a.date));
      // Show latest 5
      posts.slice(0, 5).forEach(post => {
        const li = document.createElement('li');
        li.className = 'post-item';
        li.innerHTML = `
          <div class="post-meta">
            <span>${post.date}</span>
            ${post.tags.map(t => `<span class="post-tag">${t}</span>`).join('')}
          </div>
          <h2 class="post-title"><a href="${post.file}">${post.title}</a></h2>
          <p class="post-excerpt">${post.excerpt}</p>
          <a href="${post.file}" class="post-read-more">繼續閱讀 →</a>
        `;
        list.appendChild(li);
      });
    })
    .catch(err => {
      console.error('Failed to load posts:', err);
      document.getElementById('emptyState').style.display = 'block';
    });
});
</script>
</body>
</html>
