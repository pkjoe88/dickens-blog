<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文章列表 - Dickens 的生活雜記</title>
<meta name="description" content="Dickens 的所有文章">
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>

<!-- Top Bar -->
<div class="top-bar">
  <div class="container">
    <div class="top-bar-left">
      <span>📅 <span id="currentDate"></span></span>
    </div>
    <div class="top-bar-right">
      <a href="https://github.com/pkjoe88" target="_blank" class="social-icon" title="GitHub">GH</a>
    </div>
  </div>
</div>

<!-- Header -->
<header class="site-header">
  <div class="container">
    <div class="header-main">
      <nav class="nav">
        <a href="index.html" class="site-logo">
          <div class="logo-icon">D</div>
          <span class="site-title">Dickens</span>
        </a>
        <ul class="nav-links">
          <li><a href="index.html">首頁</a></li>
          <li><a href="posts.html" class="active">文章</a></li>
          <li><a href="about.html">關於</a></li>
        </ul>
        <div class="nav-actions">
          <button class="search-btn" title="搜尋">🔍</button>
          <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="切換主題">🌙</button>
        </div>
      </nav>
    </div>
  </div>
</header>

<!-- Hero -->
<section class="hero-section" style="padding:40px 0;">
  <div class="container">
    <div style="position:relative; z-index:1; color:#fff;">
      <span class="category-badge" style="background:rgba(255,255,255,0.25);">📚 文章列表</span>
      <h1 style="font-size:32px; font-weight:900; margin:12px 0 8px;">所有文章</h1>
      <p style="opacity:0.9;">搜尋、篩選，找到你想看的內容</p>
    </div>
  </div>
</section>

<!-- Main -->
<main>
  <div class="container">
    <div class="main-layout">
      <div>
        <!-- Search -->
        <div class="search-bar">
          <input type="text" id="searchInput" placeholder="搜尋文章標題、摘要、標籤..." oninput="filterPosts()">
        </div>

        <!-- Tags -->
        <div class="tags-filter" id="tagsFilter"></div>

        <!-- Post List -->
        <div id="postList"></div>
        <div class="empty-state" id="emptyState" style="display:none;">
          <div class="icon">🔍</div>
          <p>沒有找到相關文章</p>
        </div>
      </div>

      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-widget about-widget">
          <div class="avatar">D</div>
          <h4>Dickens</h4>
          <p>生活雜記的作者</p>
          <div class="social-links">
            <a href="https://github.com/pkjoe88" target="_blank" class="social-link">GH</a>
          </div>
        </div>

        <div class="sidebar-widget">
          <h3>標籤雲</h3>
          <div class="tag-cloud" id="sidebarTags"></div>
        </div>

        <div class="sidebar-widget">
          <h3>最新文章</h3>
          <div id="sidebarRecent"></div>
        </div>
      </aside>
    </div>
  </div>
</main>

<!-- Footer -->
<footer class="site-footer">
  <div class="container">
    <div class="footer-grid">
      <div class="footer-col">
        <h4>Dickens 的生活雜記</h4>
        <p>記錄生活中的點點滴滴</p>
      </div>
      <div class="footer-col">
        <h4>快速連結</h4>
        <ul>
          <li><a href="index.html">首頁</a></li>
          <li><a href="posts.html">所有文章</a></li>
          <li><a href="about.html">關於</a></li>
        </ul>
      </div>
      <div class="footer-col">
        <h4>主題分類</h4>
        <ul id="footerTags"></ul>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2026 Dickens &middot; 用 GitHub Pages 建立</p>
    </div>
  </div>
</footer>

<button class="back-to-top" id="backToTop" aria-label="回到頂部">↑</button>

<script src="js/main.js"></script>
<script>
document.getElementById('currentDate').textContent = new Date().toLocaleDateString('zh-TW', {year:'numeric', month:'long', day:'numeric'});

let allPosts = [];
let activeTag = null;

document.addEventListener('DOMContentLoaded', function() {
  // Handle URL params
  const params = new URLSearchParams(window.location.search);
  const tagParam = params.get('tag');
  if (tagParam) activeTag = tagParam;

  fetch('data/posts.json')
    .then(r => r.json())
    .then(posts => {
      allPosts = posts.sort((a, b) => new Date(b.date) - new Date(a.date));
      renderTags();
      renderSidebarTags();
      renderSidebarRecent();
      filterPosts();
    })
    .catch(err => console.error('Failed to load posts:', err));
});

function renderTags() {
  const tags = new Set();
  allPosts.forEach(p => p.tags.forEach(t => tags.add(t)));
  const container = document.getElementById('tagsFilter');
  container.innerHTML = '';
  const allBtn = document.createElement('button');
  allBtn.className = 'tag-btn' + (!activeTag ? ' active' : '');
  allBtn.textContent = '全部';
  allBtn.onclick = () => filterByTag(null);
  container.appendChild(allBtn);
  tags.forEach(tag => {
    const btn = document.createElement('button');
    btn.className = 'tag-btn' + (activeTag === tag ? ' active' : '');
    btn.textContent = tag;
    btn.onclick = () => filterByTag(tag);
    container.appendChild(btn);
  });
}

function renderSidebarTags() {
  const tags = new Set();
  allPosts.forEach(p => p.tags.forEach(t => tags.add(t)));
  const container = document.getElementById('sidebarTags');
  container.innerHTML = '';
  tags.forEach(tag => {
    const a = document.createElement('a');
    a.href = `posts.html?tag=${encodeURIComponent(tag)}`;
    a.textContent = tag;
    container.appendChild(a);
  });
}

function renderSidebarRecent() {
  const container = document.getElementById('sidebarRecent');
  container.innerHTML = '';
  allPosts.slice(0, 5).forEach(post => {
    const topicIcons = {'技術':'💻', '生活':'📝', '網路':'🌐', 'GitHub':'🐙', '公告':'📢'};
    container.innerHTML += `
      <div class="popular-post">
        <div class="thumb">${topicIcons[post.tags[0]] || '📄'}</div>
        <div class="info">
          <h4><a href="${post.file}">${post.title}</a></h4>
          <div class="date">${post.date}</div>
        </div>
      </div>
    `;
  });
}

function filterByTag(tag) {
  activeTag = tag;
  document.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.toggle('active', b.textContent === (tag || '全部'));
  });
  filterPosts();
}

function filterPosts() {
  const query = (document.getElementById('searchInput').value || '').toLowerCase();
  const filtered = allPosts.filter(post => {
    const matchTag = !activeTag || post.tags.includes(activeTag);
    const matchQuery = !query ||
      post.title.toLowerCase().includes(query) ||
      post.excerpt.toLowerCase().includes(query) ||
      post.tags.some(t => t.toLowerCase().includes(query));
    return matchTag && matchQuery;
  });
  renderPosts(filtered);
}

function renderPosts(posts) {
  const container = document.getElementById('postList');
  const empty = document.getElementById('emptyState');
  container.innerHTML = '';
  if (posts.length === 0) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  const topicIcons = {'技術':'💻', '生活':'📝', '網路':'🌐', 'GitHub':'🐙', '公告':'📢'};
  posts.forEach(post => {
    const item = document.createElement('div');
    item.className = 'post-list-item';
    const readTime = Math.max(1, Math.ceil(post.excerpt.length / 100));
    item.innerHTML = `
      <div class="thumb">${topicIcons[post.tags[0]] || '📄'}</div>
      <div class="content">
        <h3><a href="${post.file}">${post.title}</a></h3>
        <p>${post.excerpt}</p>
        <div class="meta">
          <span>📅 ${post.date}</span>
          <span>📖 ${readTime} 分鐘</span>
          ${post.tags.map(t => `<span>${t}</span>`).join('')}
        </div>
      </div>
    `;
    container.appendChild(item);
  });
}

// Footer tags
document.addEventListener('DOMContentLoaded', function() {
  setTimeout(() => {
    const footerTags = document.getElementById('footerTags');
    if (footerTags && allPosts.length) {
      const tags = new Set();
      allPosts.forEach(p => p.tags.forEach(t => tags.add(t)));
      tags.forEach(tag => {
        footerTags.innerHTML += `<li><a href="posts.html?tag=${encodeURIComponent(tag)}">${tag}</a></li>`;
      });
    }
  }, 500);
});
</script>
</body>
</html>
