<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文章列表 - Dickens 的生活雜記</title>
<meta name="description" content="Dickens 的所有文章">
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>

<header class="site-header">
  <div class="container">
    <nav class="nav">
      <a href="index.html" class="site-title">Dickens</a>
      <ul class="nav-links">
        <li><a href="index.html">首頁</a></li>
        <li><a href="posts.html">文章</a></li>
        <li><a href="about.html">關於</a></li>
        <li><button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="切換主題">🌙</button></li>
      </ul>
    </nav>
  </div>
</header>

<section class="hero" style="padding:48px 0 36px;">
  <div class="container">
    <span class="hero-badge">📚 所有文章</span>
    <h1 style="font-size:32px;">文章列表</h1>
    <p>搜尋、篩選，找到你想看的內容</p>
  </div>
</section>

<main>
  <div class="container-wide">
    <div class="layout-with-sidebar">
      <div>
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" class="search-input" id="searchInput" placeholder="搜尋文章標題、摘要、標籤..." oninput="filterPosts()">
        </div>
        <div class="tags-filter" id="tagsFilter"></div>
        <div class="post-grid" id="postList"></div>
        <div class="empty-state" id="emptyState" style="display:none;">
          <div class="icon">🔍</div>
          <p>沒有找到相關文章</p>
        </div>
      </div>
      <aside class="sidebar">
        <div class="sidebar-widget">
          <h3>標籤</h3>
          <div class="sidebar-tag-cloud" id="sidebarTags"></div>
        </div>
        <div class="sidebar-widget">
          <h3>最新文章</h3>
          <ul class="sidebar-recent" id="sidebarRecent"></ul>
        </div>
      </aside>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-links">
      <a href="https://github.com/pkjoe88" target="_blank">GitHub</a>
      <a href="posts.html">文章</a>
      <a href="about.html">關於</a>
    </div>
    <p>&copy; 2026 Dickens &middot; 用 GitHub Pages 建立</p>
  </div>
</footer>

<button class="back-to-top" id="backToTop" aria-label="回到頂部">↑</button>

<script src="js/main.js"></script>
<script>
let allPosts = [];
let activeTag = null;

document.addEventListener('DOMContentLoaded', function() {
  fetch('data/posts.json')
    .then(r => r.json())
    .then(posts => {
      allPosts = posts.sort((a, b) => new Date(b.date) - new Date(a.date));
      renderTags();
      renderSidebarTags();
      renderSidebarRecent();
      renderPosts(allPosts);
    })
    .catch(err => console.error('Failed to load posts:', err));
});

function renderTags() {
  const tags = new Set();
  allPosts.forEach(p => p.tags.forEach(t => tags.add(t)));
  const container = document.getElementById('tagsFilter');
  container.innerHTML = '';
  const allBtn = document.createElement('button');
  allBtn.className = 'tag-btn active';
  allBtn.textContent = '全部';
  allBtn.onclick = () => filterByTag(null);
  container.appendChild(allBtn);
  tags.forEach(tag => {
    const btn = document.createElement('button');
    btn.className = 'tag-btn';
    btn.textContent = tag;
    btn.onclick = () => filterByTag(tag);
    container.appendChild(btn);
  });
}

function renderSidebarTags() {
  const tags = new Set();
  allPosts.forEach(p => p.tags.forEach(t => tags.add(t)));
  const container = document.getElementById('sidebarTags');
  container.innerHTML = '';
  tags.forEach(tag => {
    const a = document.createElement('a');
    a.className = 'sidebar-tag';
    a.href = '#';
    a.textContent = tag;
    a.onclick = (e) => { e.preventDefault(); filterByTag(tag); window.scrollTo({top:0, behavior:'smooth'}); };
    container.appendChild(a);
  });
}

function renderSidebarRecent() {
  const container = document.getElementById('sidebarRecent');
  container.innerHTML = '';
  allPosts.slice(0, 5).forEach(post => {
    const li = document.createElement('li');
    li.innerHTML = `<a href="${post.file}">${post.title}<div class="date">${post.date}</div></a>`;
    container.appendChild(li);
  });
}

function filterByTag(tag) {
  activeTag = tag;
  document.querySelectorAll('.tag-btn').forEach(b => {
    b.classList.toggle('active', b.textContent === (tag || '全部'));
  });
  filterPosts();
}

function filterPosts() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  const filtered = allPosts.filter(post => {
    const matchTag = !activeTag || post.tags.includes(activeTag);
    const matchQuery = !query ||
      post.title.toLowerCase().includes(query) ||
      post.excerpt.toLowerCase().includes(query) ||
      post.tags.some(t => t.toLowerCase().includes(query));
    return matchTag && matchQuery;
  });
  renderPosts(filtered);
}

function renderPosts(posts) {
  const container = document.getElementById('postList');
  const empty = document.getElementById('emptyState');
  container.innerHTML = '';
  if (posts.length === 0) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  posts.forEach(post => {
    const card = document.createElement('div');
    card.className = 'post-card';
    const readTime = Math.max(1, Math.ceil(post.excerpt.length / 100));
    card.innerHTML = `
      <div class="post-card-meta">
        <span>${post.date}</span>
        <div class="post-card-tags">
          ${post.tags.map(t => `<span class="post-tag">${t}</span>`).join('')}
        </div>
      </div>
      <h2 class="post-card-title"><a href="${post.file}">${post.title}</a></h2>
      <p class="post-card-excerpt">${post.excerpt}</p>
      <div class="post-card-footer">
        <span class="read-time">📖 約 ${readTime} 分鐘閱讀</span>
        <a href="${post.file}" class="read-more">繼續閱讀 →</a>
      </div>
    `;
    container.appendChild(card);
  });
}
</script>
</body>
</html>
